<form (ngSubmit)="onRegister()">
  <div class="login">
    <div class="login-container">
      <div class="login-panel">
        <h2>Đăng ký</h2>

        <div class="input-group">
          <label>Username</label>
          <input
            type="text"
            name="username"
            [(ngModel)]="username"
            placeholder="Nhập tên"
            autocomplete="off"
            required
          />
        </div>

        <div class="input-group">
          <label>Tài khoản</label>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Nhập tài khoản"
            autocomplete="off"
            required
          />
        </div>

        <div class="input-group">
          <label>Mật khẩu</label>
          <input
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Nhập mật khẩu"
            required
          />
        </div>

        <div class="input-group">
          <label>Role</label>
          <select name="role" [(ngModel)]="role" required>
            <option [ngValue]="0">Admin</option>
            <option [ngValue]="1">Customer</option>
            <option [ngValue]="2">Staff</option>
          </select>
        </div>

        <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button type="submit" class="btn" [disabled]="isLoading">
          {{ isLoading ? 'Đang đăng ký...' : 'Đăng ký' }}
        </button>

        <div class="action">
          <p class="btn-register" (click)="goTo('login')">Đăng nhập</p>
          <p class="btn-changepass">Quên mật khẩu</p>
        </div>
      </div>
    </div>
  </div>
</form>
