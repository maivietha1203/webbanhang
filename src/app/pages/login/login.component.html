<div class="login">
  <div class="login-container">
    <div class="login-panel">
      <h2>Đăng nhập</h2>

      <div class="input-group">
        <label>Tài khoản</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Nhập tài khoản"
          autocomplete="off"
          required
        />
      </div>

      <div class="input-group">
        <label>Mật khẩu</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Nhập mật khẩu"
          required
        />
      </div>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
      <button type="button" class="btn" (click)="onLogin()" [disabled]="isLoading">
        {{ isLoading ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>

      <div class="action">
        <p class="btn-register" routerLink="/register">Đăng ký ngay</p>
      </div>
    </div>
  </div>
</div>
