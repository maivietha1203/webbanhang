<div class="product-more">
  <div class="title-block">SẢN PHẨM BẠN ĐÃ XEM GẦN ĐÂY</div>

  <div class="product-list">
    <div class="row">
      <div class="col-6 col-md-3" *ngFor="let product of recentProducts">
        <div class="item-product">
          <div class="product-top">
            <div class="product-image">
              <a href="">
                <img [src]="product.image" [alt]="product.name" />
              </a>
            </div>

            <div class="label discount" style="display: block">
              {{ product.discount }}
            </div>

            <div class="quick-view" (click)="handleShowPopup()">
              <div class="title">
                <img src="../../../assets/images/add_shopping_cart2.svg" alt="cart" />
                <span>Thêm nhanh vào giỏ hàng</span>
              </div>
            </div>
          </div>

          <div class="product-bottom">
            <div class="variant-block">
              <ul class="variant-list">
                <li
                  class="variant-item"
                  *ngFor="let variant of product.variant; let i = index"
                  [class.current]="i === 0"
                >
                  <img [src]="variant.image" [alt]="variant.name" />
                </li>
              </ul>
            </div>
            <div class="rating-label">
              <div class="rating">
                <span class="score"> {{ product.rating }}/5 </span>

                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="19"
                  height="19"
                  viewBox="0 0 19 19"
                  fill="none"
                >
                  <path
                    d="M9.03834 1.10996C9.20914 0.699319 9.79086 0.699318 9.96166 1.10996L12.16 6.39541C12.232 6.56853 12.3948 6.68682 12.5817 6.7018L18.2878 7.15925C18.7311 7.1948 18.9109 7.74805 18.5731 8.03738L14.2257 11.7614C14.0833 11.8834 14.021 12.0748 14.0646 12.2572L15.3928 17.8253C15.496 18.258 15.025 18.5999 14.6458 18.3681L9.76063 15.3842C9.60062 15.2865 9.39938 15.2865 9.23937 15.3842L4.35417 18.3681C3.97462 18.5999 3.50399 18.258 3.60718 17.8253L4.9354 12.2572C4.9789 12.0748 4.91672 11.8834 4.77432 11.7614L0.426885 8.03738C0.0891163 7.74805 0.268879 7.1948 0.712206 7.15925L6.41829 6.7018C6.60519 6.68653 6.76799 6.56853 6.84 6.39541L9.03834 1.10996Z"
                    fill="#F6A733"
                  />
                </svg>
              </div>
            </div>

            <div class="product-name">
              <a href="">
                <h3>
                  {{ product.name }}
                </h3>
              </a>
            </div>

            <div class="price-product">
              <div class="current-price">{{ product.currentPrice }}đ</div>

              <div class="regular-price">{{ product.regularPrice }}đ</div>
            </div>

            <div class="process-product">
              <div class="title">
                <b>{{ product.sold }}</b>
                sản phẩm đã bán
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
