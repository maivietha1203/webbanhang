<div class="banner-col-block">
  <div class="container">
    <div class="banner-content">
      <div class="row">
        <div class="col-12 col-md-6" *ngFor="let item of banner">
          <div class="image-banner">
            <div [routerLink]="item.link">
              <img [src]="item.image" [alt]="item.alt" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
