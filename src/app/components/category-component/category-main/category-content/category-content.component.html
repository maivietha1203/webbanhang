<div class="content-page">
  <div class="empty-result" style="display: none">
    <div class="title-epmty">
      <div class="empty-ic">
        <svg
          class="ant-empty-img-simple"
          width="64"
          height="41"
          viewBox="0 0 64 41"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g transform="translate(0 1)" fill="none" fill-rule="evenodd">
            <ellipse fill="#f5f5f5" cx="32" cy="33" rx="32" ry="7"></ellipse>
            <g stroke="#d9d9d9" fill-rule="nonzero">
              <path
                d="M55 12.76L44.854 1.258C44.367.474 43.656 0 42.907 0H21.093c-.749 0-1.46.474-1.947 1.257L9 12.761V22h46v-9.24z"
              ></path>
              <path
                d="M41.613 15.931c0-1.605.994-2.93 2.227-2.931H55v18.137C55 33.26 53.68 35 52.05 35h-40.1C10.32 35 9 33.259 9 31.137V13h11.16c1.233 0 2.227 1.323 2.227 2.928v.022c0 1.605 1.005 2.901 2.237 2.901h14.752c1.232 0 2.237-1.308 2.237-2.913v-.007z"
                class="ant-empty-img-simple-path"
              ></path>
            </g>
          </g>
        </svg>
      </div>
      <p class="text">
        Rất tiếc! <br />
        Chúng tôi không tìm thấy sản phẩm này
      </p>
    </div>
  </div>
  <div class="product-result category-type">
    <div class="product-list">
      <div class="row row-product-list">
        <div class="col-6 col-md-4 col-child" *ngFor="let item of categoryProduct">
          <div class="item-product">
            <div class="product-top">
              <div class="product-image">
                <div>
                  <img [src]="item.image" [alt]="item.name" />
                </div>
              </div>

              <div *ngIf="item.discount" class="label discount">
                {{ item.discount }}
              </div>

              <div class="quick-view" (click)="handleShowSort()">
                <div class="title">
                  <img src="../../../assets/images/add_shopping_cart2.svg" alt="cart" />

                  <span>Thêm nhanh vào giỏ hàng</span>
                </div>
              </div>
            </div>

            <div class="product-bottom">
              <div class="variant-block">
                <ul class="variant-list">
                  <li
                    class="variant-item"
                    *ngFor="let variant of item.variants; let i = index"
                    [class.current]="i === 0"
                  >
                    <img [src]="variant.image" [alt]="variant.name" />
                  </li>
                </ul>
              </div>

              <div class="rating-label">
                <div class="rating">
                  <span class="score"> {{ item.rating }}/5 </span>

                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="19"
                    height="19"
                    viewBox="0 0 19 19"
                    fill="none"
                  >
                    <path
                      d="M9.03834 1.10996C9.20914 0.699319 9.79086 0.699318 9.96166 1.10996L12.16 6.39541C12.232 6.56853 12.3948 6.68682 12.5817 6.7018L18.2878 7.15925C18.7311 7.1948 18.9109 7.74805 18.5731 8.03738L14.2257 11.7614C14.0833 11.8834 14.0211 12.0748 14.0646 12.2572L15.3928 17.8253C15.496 18.258 15.0254 18.5999 14.6458 18.3681L9.76063 15.3842C9.60062 15.2865 9.39938 15.2865 9.23937 15.3842L4.35417 18.3681C3.97462 18.5999 3.50399 18.258 3.60718 17.8253L4.9354 12.2572C4.9789 12.0748 4.91672 11.8834 4.77432 11.7614L0.426885 8.03738C0.0891163 7.74805 0.268879 7.1948 0.712206 7.15925L6.41829 6.7018C6.60519 6.68682 6.76799 6.56853 6.84 6.39541L9.03834 1.10996Z"
                      fill="#F6A733"
                    />
                  </svg>
                </div>
              </div>

              <div class="product-name">
                <div class="name-wrapper">
                  <h3 (click)="onSelectItem(item)">
                    {{ item.name }}
                  </h3>
                </div>
              </div>

              <div class="price-product">
                <div class="current-price">
                  {{ item.currentPrice }}
                </div>

                <div class="regular-price">
                  {{ item.regularPrice }}
                </div>
              </div>

              <div class="process-product">
                <div class="title">
                  <b>{{ item.sold }}</b>
                  sản phẩm đã bán
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="wrap-load-more">
      <div class="view-more">Xem thêm</div>
    </div>

    <div class="desc-view-more">Hiển thị 1 - 15 trên tổng số 121 sản phẩm</div>
  </div>
</div>
<nz-modal
  [(nzVisible)]="isSortPopup"
  [nzFooter]="null"
  [nzClosable]="false"
  [nzCentered]="true"
  nzWidth="65%"
  nzClassName="search-product"
  (nzOnCancel)="handleSort()"
>
  <ng-container *nzModalContent>
    <product-popup-layout (closeProductPopup)="handleSort()"></product-popup-layout>
  </ng-container>
</nz-modal>
